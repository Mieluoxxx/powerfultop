name: Release ARM64 DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example, v1.3.8)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and set bundle version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; got: $RELEASE_TAG" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" PowerTop/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" PowerTop/Info.plist

          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Bundle version: $VERSION ($GITHUB_RUN_NUMBER)"

      - name: Run regression tests
        run: bash test.sh

      - name: Build application
        run: bash build.sh

      - name: Verify and ad-hoc sign ARM64 application
        shell: bash
        run: |
          set -euo pipefail

          APP="build/PowerfulTop.app"
          BINARY="$APP/Contents/MacOS/PowerfulTop"
          ARCHS="$(lipo -archs "$BINARY")"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected an arm64-only executable; got: $ARCHS" >&2
            exit 1
          fi

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail

          DMG_ROOT="$RUNNER_TEMP/PowerfulTop-dmg-root"
          RELEASE_DIR="$GITHUB_WORKSPACE/build/release"
          DMG_NAME="PowerfulTop-${RELEASE_TAG}-arm64.dmg"
          DMG_PATH="$RELEASE_DIR/$DMG_NAME"
          ZIP_PATH="$RELEASE_DIR/PowerfulTop.zip"
          CHECKSUM_PATH="$RELEASE_DIR/PowerfulTop-${RELEASE_TAG}-SHA256SUMS.txt"

          mkdir -p "$DMG_ROOT" "$RELEASE_DIR"
          ditto "build/PowerfulTop.app" "$DMG_ROOT/PowerfulTop.app"
          ditto -c -k --sequesterRsrc --keepParent "build/PowerfulTop.app" "$ZIP_PATH"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "PowerfulTop $RELEASE_VERSION" \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            -ov \
            "$DMG_PATH"

          hdiutil verify "$DMG_PATH"
          (
            cd "$RELEASE_DIR"
            shasum -a 256 "$DMG_NAME" "PowerfulTop.zip" > "$(basename "$CHECKSUM_PATH")"
          )

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PowerfulTop-${{ env.RELEASE_TAG }}-arm64
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG_PATH" "$ZIP_PATH" "$CHECKSUM_PATH"
          else
            gh release create "$RELEASE_TAG" \
              "$DMG_PATH" \
              "$ZIP_PATH" \
              "$CHECKSUM_PATH" \
              --verify-tag \
              --title "PowerTop $RELEASE_TAG" \
              --notes "Automated ARM64 build. The application is ad-hoc signed and is not Apple-notarized." \
              --generate-notes
          fi

          {
            echo "### PowerTop $RELEASE_TAG"
            echo
            echo "Published \`${{ steps.package.outputs.dmg_name }}\`, \`PowerfulTop.zip\`, and SHA-256 checksums."
          } >> "$GITHUB_STEP_SUMMARY"
